# Render Blueprint: one free web service that runs the API and serves the screens.
# The database is MongoDB Atlas (set MONGODB_URI when Render asks for it).
services:
  - type: web
    name: solar-coop-complaints
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      # The in-memory test database is not needed on the host; skip its large download during the build.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: NODE_ENV
        value: production
      # Asked for when the Blueprint is created - never stored in the repository.
      - key: MONGODB_URI
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # A whole office usually shares one internet connection, so allow more requests per address.
      - key: RATE_LIMIT_MAX
        value: 3000
